# /etc/nginx/sites-available/aromajiwa
# Ganti "aromajiwa.duckdns.org" dengan domain Anda, lalu:
#   sudo ln -s /etc/nginx/sites-available/aromajiwa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d aromajiwa.duckdns.org     (menambah blok 443 + redirect)
#
# Catatan: proxy_buffering HARUS off, kalau tidak /api/stream (SSE) tidak
# mengalir dan kartu member tidak berubah realtime.

server {
    listen 80;
    listen [::]:80;
    server_name aromajiwa.duckdns.org;

    # Laporan stok / foto kamera dikirim sebagai base64 dalam JSON.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Server-Sent Events
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Berkas verifikasi Trusted Web Activity - harus apa adanya, tanpa cache.
    location = /.well-known/assetlinks.json {
        proxy_pass http://127.0.0.1:4000/.well-known/assetlinks.json;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }
}
